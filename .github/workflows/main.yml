name: Build ExcellentShop Complete
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Inject NightCore & Bypass Dead Dependencies
      run: |
        mvn install:install-file -Dfile=nightcore-2.16.4.jar -DgroupId=su.nightexpress.nightcore -DartifactId=main -Dversion=2.16.4 -Dpackaging=jar
        mvn install:install-file -Dfile=nightcore-2.16.4.jar -DgroupId=su.nightexpress.nightcore -DartifactId=spigot -Dversion=2.16.4 -Dpackaging=jar
        mvn install:install-file -Dfile=nightcore-2.16.4.jar -DgroupId=su.nightexpress.nightcore -DartifactId=utils -Dversion=2.16.4 -Dpackaging=jar
        touch dummy.jar
        mvn install:install-file -Dfile=dummy.jar -DgroupId=net.alex9849.advancedregionmarket -DartifactId=advancedregionmarket -Dversion=3.5.3 -Dpackaging=jar
        
    - name: Build ExcellentShop with Shade
      run: mvn clean package shade:shade -Dmaven.compiler.failOnError=false
      
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ExcellentShop-Shaded
        path: "target/*.jar"
