name: Build ExcellentShop Final Fix
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Inject NightCore & Purge Dead Module
      run: |
        mvn install:install-file -Dfile=nightcore-2.16.4.jar -DgroupId=su.nightexpress.nightcore -DartifactId=main -Dversion=2.16.4 -Dpackaging=jar
        mvn install:install-file -Dfile=nightcore-2.16.4.jar -DgroupId=su.nightexpress.nightcore -DartifactId=spigot -Dversion=2.16.4 -Dpackaging=jar
        mvn install:install-file -Dfile=nightcore-2.16.4.jar -DgroupId=su.nightexpress.nightcore -DartifactId=utils -Dversion=2.16.4 -Dpackaging=jar
        
        # Completely wipe the dead integration folder and entry
        rm -rf integration-advanced-region-market
        sed -i '/integration-advanced-region-market/d' pom.xml
        sed -i '/integration-advanced-region-market/d' Core/pom.xml
        
    - name: Build ExcellentShop Core
      run: mvn clean package -Dmaven.compiler.failOnError=false
      
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ExcellentShop-Real-Core
        path: "Core/target/Core-*.jar"
